// ─── REQUESTS ─────────────────────────────────────────────────────────────────
async function addRequestRow() {
  const roomId = S.currentRoomId;
  const room = S.rooms.find(r=>r.ID==roomId);
  const reqs = S.requests.filter(r=>r.room_id==roomId);
  const revisions = [...new Set(reqs.map(r=>r.revision))].filter(Boolean).sort((a,b)=>revNum(a)-revNum(b));
  const lastRev = revisions[revisions.length-1]||'R0';
  const revReqs = reqs.filter(r=>r.revision===lastRev);
  const maxNr = revReqs.reduce((m,r)=>Math.max(m,r.nr||0),0);
  await spPost('LI_Requests',{room_id:String(roomId),project_id:String(room.project_id),nr:maxNr+1,revision:lastRev,status:'Waiting Information',requested_date:today(),sort_order:reqs.length});
  await touchProject();
  toast('Riga aggiunta','success');
  await loadAll();
  if (S.currentPage==='room') renderRoomDetail();
}

function openAddRevisionModal() {
  const roomId = S.currentRoomId;
  const reqs = S.requests.filter(r=>r.room_id==roomId);
  const revisions = [...new Set(reqs.map(r=>r.revision))].filter(Boolean).sort((a,b)=>revNum(a)-revNum(b));
  const lastRev = revisions[revisions.length-1]||'R0';
  const nextRev = `R${revNum(lastRev)+1}`;
  document.getElementById('revision-modal-title').textContent = `Aggiungi Revisione ${nextRev}`;
  document.getElementById('revision-modal-desc').textContent = `Nuova revisione: ${nextRev}`;
  document.getElementById('revision-date-label').textContent = `Data di invio revisione ${lastRev} *`;
  document.getElementById('revision-prev-date').value='';
  document.getElementById('revision-error').style.display='none';
  S._lastRevForAdd = lastRev;
  S._nextRevForAdd = nextRev;
  openModal('modal-add-revision');
}

async function saveRevision() {
  const date = document.getElementById('revision-prev-date').value;
  if (!date) { const e=document.getElementById('revision-error'); e.textContent='Inserisci la data di invio della revisione precedente.'; e.style.display='block'; return; }
  const roomId = S.currentRoomId;
  const room = S.rooms.find(r=>r.ID==roomId);
  const prevReqs = S.requests.filter(r=>r.room_id==roomId&&r.revision===S._lastRevForAdd);
  for (const req of prevReqs) await spPatch('LI_Requests',req.ID,{revision_date:date});
  await spPost('LI_Requests',{room_id:String(roomId),project_id:String(room.project_id),nr:1,revision:S._nextRevForAdd,status:'Waiting Information',requested_date:today(),sort_order:S.requests.filter(r=>r.room_id==roomId).length});
  await touchProject();
  closeModal('modal-add-revision');
  toast(`Revisione ${S._nextRevForAdd} aggiunta`,'success');
  await loadAll();
  if (S.currentPage==='room') renderRoomDetail();
}

function openAddRecipientModal() {
  document.getElementById('recipient-name-input').value='';
  openModal('modal-add-recipient');
}

async function saveRecipient() {
  const name = document.getElementById('recipient-name-input').value.trim();
  if (!name) return;
  const roomId = S.currentRoomId;
  const reqs = S.requests.filter(r=>r.room_id==roomId);
  for (const req of reqs) {
    const existing = parseJSON(req.recipients)||[];
    if (!existing.find(r=>r.name===name)) {
      await spPatch('LI_Requests',req.ID,{recipients:JSON.stringify([...existing,{name,response:'',date:'',notes:''}])});
    }
  }
  closeModal('modal-add-recipient');
  toast('Destinatario aggiunto','success');
  await loadAll();
  if (S.currentPage==='room') renderRoomDetail();
}

async function updateRequestStatus(reqId, status) {
  await spPatch('LI_Requests',reqId,{status, has_customer_reply: false});
  const req = S.requests.find(r=>r.ID==reqId);
  if (req) { req.status=status; req.has_customer_reply=false; }
  await recalcRoomStatus(S.currentRoomId);
  await touchProject();
  if (status==='Waiting Information' && S.project?.customer_email) {
    sendEmailNotification(S.project.customer_email, `📋 Nuova richiesta — ${S.project.ref_code}`, 'new_request');
  }
  await loadAll();
  if (S.currentPage==='room') renderRoomDetail();
}

let _labDebounce = {};
async function updateLabRequest(reqId, text) {
  clearTimeout(_labDebounce[reqId]);
  _labDebounce[reqId] = setTimeout(async()=>{
    const en = await translateIT(text);
    await spPatch('LI_Requests',reqId,{lab_request_IT:text,lab_request_EN:en});
    const enEl = document.getElementById('en-'+reqId);
    if (enEl) enEl.textContent = en||'—';
    await touchProject();
  }, 1000);
}

let _responseDebounce = {};
async function updateCustomerResponse(reqId, text) {
  clearTimeout(_responseDebounce[reqId]);
  _responseDebounce[reqId] = setTimeout(async()=>{
    const en = await translateIT(text);
    await spPatch('LI_Requests',reqId,{customer_response:text,customer_response_en:en,has_customer_reply:!!text});
    const req = S.requests.find(r=>r.ID==reqId);
    if (req) { req.customer_response=text; req.customer_response_en=en; req.has_customer_reply=!!text; }
    await touchProject();
    // Notify technicians
    if (S.project) {
      const techs = S.technicians.filter(t=>t.email&&t.is_active);
      for (const t of techs) sendEmailNotification(t.email, `💬 Nuova risposta cliente — ${S.project.ref_code}`, 'customer_reply');
    }
    if (S.currentPage==='room') renderRoomDetail();
  },1500);
}

async function updateRecipient(reqId, recName, field, value) {
  const req = S.requests.find(r=>r.ID==reqId);
  if (!req) return;
  const recipients = parseJSON(req.recipients)||[];
  const idx = recipients.findIndex(r=>r.name===recName);
  if (idx>=0) recipients[idx][field]=value;
  else recipients.push({name:recName,[field]:value});
  await spPatch('LI_Requests',reqId,{recipients:JSON.stringify(recipients)});
  if (req) req.recipients = JSON.stringify(recipients);
}

// ─── CONFIRM ROOM ─────────────────────────────────────────────────────────────
function confirmRoomClick() {
  const roomId = S.currentRoomId;
  const reqs = S.requests.filter(r=>r.room_id==roomId);
  const wiReqs = reqs.filter(r=>r.status==='Waiting Information');
  if (wiReqs.length>0) {
    toast(`❌ Impossibile confermare: ${wiReqs.length} richiesta${wiReqs.length>1?'e sono':' è'} ancora in Waiting Information.`, 'error');
    // Scroll to first WI row
    const firstWI = document.getElementById('req-row-'+wiReqs[0].ID);
    if (firstWI) {
      firstWI.scrollIntoView({behavior:'smooth',block:'center'});
      firstWI.classList.add('req-row-wi-highlight');
      setTimeout(()=>firstWI.classList.remove('req-row-wi-highlight'),3000);
    }
    return;
  }
  // Get last revision info
  const revisions = [...new Set(reqs.map(r=>r.revision))].filter(Boolean).sort((a,b)=>revNum(a)-revNum(b));
  const lastRev = revisions[revisions.length-1]||'R0';
  const lastRevDate = reqs.find(r=>r.revision===lastRev)?.revision_date;
  S._confirmLastRev = lastRev;
  S._confirmLastRevDate = lastRevDate;
  document.getElementById('confirm-room-desc').textContent = `Ultima revisione: ${lastRev}${lastRevDate?' — inviata il '+fmtDate(lastRevDate):''}`;
  document.getElementById('confirm-room-date').value='';
  document.getElementById('confirm-room-preview').style.display='none';
  document.getElementById('confirm-room-error').style.display='none';
  document.getElementById('confirm-room-date').oninput = function() {
    const preview = document.getElementById('confirm-room-preview');
    if (this.value) {
      const text = buildConfirmText(this.value, S._confirmLastRev, S._confirmLastRevDate);
      preview.textContent = '📝 Verrà salvato: "'+text+'"';
      preview.style.display='block';
    } else preview.style.display='none';
  };
  openModal('modal-confirm-room');
}

function buildConfirmText(confirmDate, lastRev, lastRevDate) {
  return `Conferma del ${fmtDate(confirmDate)} riferita alla revisione ${lastRev}${lastRevDate?' del '+fmtDate(lastRevDate):''}`;
}

async function confirmRoom() {
  const date = document.getElementById('confirm-room-date').value;
  if (!date) { const e=document.getElementById('confirm-room-error'); e.textContent='Inserisci la data di conferma.'; e.style.display='block'; return; }
  const roomId = S.currentRoomId;
  const room = S.rooms.find(r=>r.ID==roomId);
  const confirmText = buildConfirmText(date, S._confirmLastRev, S._confirmLastRevDate);
  await spPatch('LI_Rooms',roomId,{status:'Confirmed',confirmed_date:date,confirmation_text:confirmText});
  const reqs = S.requests.filter(r=>r.room_id==roomId&&r.status!=='Cancelled');
  for (const req of reqs) await spPatch('LI_Requests',req.ID,{status:'Confirmed'});
  await touchProject();
  if (S.project?.customer_email) sendEmailNotification(S.project.customer_email,`✅ Stanza confermata — ${room.room_name}`,'room_confirmed');
  closeModal('modal-confirm-room');
  toast(`✅ Stanza ${room.room_name} confermata il ${fmtDate(date)}`,'success');
  await loadAll();
  if (S.currentPage==='room') renderRoomDetail();
}

async function uploadCustomerImage(reqId, input) {

  const req = S.requests.find(r=>r.ID==reqId);

    for (const t of techs) sendEmailNotification(t.email,`💬 Risposta cliente — ${S.project.ref_code}`,'customer_reply');
  }
  renderRequestsTable();

async function uploadToSP(file) {
  if (!S.spUrl) { toast('SharePoint non configurato','error'); return null; }
  try {
    await getDigest();
    const fn = encodeURIComponent(file.name);
    const buf = await file.arrayBuffer();
    const r = await fetch(`${S.spUrl}/_api/web/getfolderbyserverrelativeurl('Shared Documents')/files/add(url='${fn}',overwrite=true)`, {
      method:'POST', credentials:'include',
      headers:{ 'Accept':'application/json;odata=verbose', 'X-RequestDigest':window._spPageContextInfo?.formDigestValue||'', 'content-length':buf.byteLength },
      body: buf
    });
    const d = await r.json();
    return S.spUrl + d.d.ServerRelativeUrl;
  } catch(e) { toast('Errore upload: '+e.message,'error'); return null; }
}

// ─── DWG / PDF ────────────────────────────────────────────────────────────────
async function uploadDWG(input) {
  const file = input.files[0];
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.dwg')) { toast('Solo file .dwg','error'); return; }
  if (file.size>50*1024*1024) { toast('File troppo grande (max 50MB)','error'); return; }
  const url = await uploadToSP(file);
  if (!url) return;
  const room = S.rooms.find(r=>r.ID==S.currentRoomId);
  await spPost('LI_WorkDocuments',{room_id:String(S.currentRoomId),project_id:String(room.project_id),file_url:url,file_name:file.name,file_type:'dwg',upload_date:today()});
  toast('DWG caricato','success');
  await loadAll();
  renderTechLibrary();
  input.value='';
}

async function deleteDWG(id) {
  genericConfirm('Elimina DWG','Vuoi eliminare questo file DWG?',async()=>{ await spDelete('LI_WorkDocuments',id); toast('DWG eliminato','info'); await loadAll(); renderTechLibrary(); });
}

let _pendingPDFFile = null;

  const file = input.files[0];

  if (!file.name.toLowerCase().endsWith('.pdf')) { toast('Solo file .pdf','error'); return; }

  _pendingPDFFile = file;
  document.getElementById('pdf-name-input').value=file.name;
  document.getElementById('pdf-sign-date').value='';

  document.getElementById('pdf-revision-select').innerHTML = revisions.map(r=>`<option value="${r}">${r}</option>`).join('');
  openModal('modal-pdf-meta');

async function deletePDF(id) {

// ─── ROOM STATUS RECALC ───────────────────────────────────────────────────────
async function recalcRoomStatus(roomId) {
  const room = S.rooms.find(r=>r.ID==roomId);
  if (!room||room.is_cancelled||room.status==='Confirmed') return;
  const reqs = S.requests.filter(r=>r.room_id==roomId);
  const active = reqs.filter(r=>r.status!=='Cancelled');
  let newStatus = 'Work in Progress';
  if (active.some(r=>r.status==='Waiting Information')) newStatus='Waiting Information';
  await spPatch('LI_Rooms',roomId,{status:newStatus});
  if (room) room.status=newStatus;
}

// ─── UTILITIES ────────────────────────────────────────────────────────────────
async function touchProject() {
  if (!S.project) return;
  const now = new Date().toISOString();
  await spPatch('LI_Projects',S.project.ID,{last_change_date:now});
  if (S.project) S.project.last_change_date=now;
}

async function translateIT(text) {
  if (!text||!text.trim()) return '';
  try {
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=it|en`);
    const d = await r.json();
    return d?.responseData?.translatedText||'';
  } catch(e) { return ''; }
}

async function sendEmailNotification(to, subject, event) {
  try {
    await spPost('LI_EmailLog',{to_email:to,event:subject,status:'sent',project_id:String(S.project?.ID||''),room_name:''});
    // Actual email via SP Flow would be triggered here
  } catch(e) {}
}

function statusBadge(status, large=false) {
  const map = {
    'Waiting Information':['badge-waiting','⏳ Waiting Information'],
    'Work in Progress':['badge-wip','🔵 Work in Progress'],
    'Defined':['badge-defined','✓ Defined'],
    'Confirmed':['badge-confirmed','✅ Confirmed'],
    'Cancelled':['badge-cancelled','✕ Cancelled'],
  };
  const [cls,label] = map[status]||['badge-cancelled',status];
  return `<span class="badge ${cls}" style="${large?'font-size:13px;padding:5px 14px;':''}">${label}</span>`;
}

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
}

function fmtDateTime(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return `${fmtDate(d)} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}

function today() { return new Date().toISOString().split('T')[0]; }
function revNum(r) { return parseInt((r||'R0').replace('R',''),10)||0; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function parseJSON(s) { try { return typeof s==='string' ? JSON.parse(s) : s; } catch(e) { return null; } }

// Generic confirm modal
function genericConfirm(title, msg, onConfirm) {
  document.getElementById('generic-confirm-title').textContent=title;
  document.getElementById('generic-confirm-msg').textContent=msg;
  document.getElementById('generic-confirm-btn').onclick=()=>{ closeModal('modal-generic-confirm'); onConfirm(); };
  openModal('modal-generic-confirm');
}

// Lightbox
function openLightbox(images, index) {
  S.lbImages=images; S.lbIndex=index;
  document.getElementById('lb-img').src=images[index]?.url||images[index]||'';
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }
function lbNav(dir) {
  S.lbIndex=(S.lbIndex+dir+S.lbImages.length)%S.lbImages.length;
  document.getElementById('lb-img').src=S.lbImages[S.lbIndex]?.url||S.lbImages[S.lbIndex]||'';
}

// Click outside modal to close
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{ if(e.target===o) { o.classList.remove('show'); o.querySelector('.modal')?.classList.remove('show'); setTimeout(()=>o.style.display='none',200); } });
});

// ─── BOOT ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', ()=>{
  // Auto-detect SharePoint project site URL
  if (!S.spUrl) {
    if (window._spPageContextInfo?.webAbsoluteUrl) {
      S.spUrl = window._spPageContextInfo.webAbsoluteUrl.replace(/\/$/, '');
    } else {
      const loc = window.location;
      const match = loc.pathname.match(/^(\/sites\/[^/]+)/);
      S.spUrl = loc.origin + (match ? match[1] : '');
    }
    localStorage.setItem('li_sp_url', S.spUrl);
  }
  loadAll();
});
